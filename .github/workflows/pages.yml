# Publishes the explorer (web/lab) to GitHub Pages. Manual only: run it from the Actions tab if wanted.
name: Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the native generator
        run: make -C gen gen_host
      - name: Determinism and WASM parity
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Assemble site (explorer only; the gallery lives on Vercel)
        run: |
          mkdir -p _site
          cp -r web/lab/. _site/
          cp web/seedlab.js web/gen.wasm _site/
          sed -i 's|\.\./seedlab.js|seedlab.js|; ' _site/index.html
          sed -i "s|'\.\./gen.wasm'|'gen.wasm'|" _site/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
